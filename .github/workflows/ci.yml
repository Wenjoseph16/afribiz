name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run prisma:generate
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run prisma:generate
      - run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afribiz_test
          POSTGRES_USER: afribiz
          POSTGRES_PASSWORD: afribiz_test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://afribiz:afribiz_test_pwd@localhost:5432/afribiz_test
      - run: npm exec -w backend -- prisma migrate deploy
        env:
          DATABASE_URL: postgresql://afribiz:afribiz_test_pwd@localhost:5432/afribiz_test
      - name: Backend unit tests
        run: npm run test:unit -w backend
        env:
          DATABASE_URL: postgresql://afribiz:afribiz_test_pwd@localhost:5432/afribiz_test
          NODE_ENV: test
      - name: Frontend tests
        run: npm run test -w frontend
        continue-on-error: true
