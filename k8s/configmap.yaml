apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: afribiz
data:
  NODE_ENV: "production"
  PORT: "3001"
  FRONTEND_URL: "https://afribiz.com"
  ALLOWED_ORIGINS: "https://afribiz.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_WINDOW_MS: "60000"
  AUTH_RATE_LIMIT_MAX_REQUESTS: "10"
  MAX_FILE_SIZE: "10485760"
  UPLOAD_DIR: "/app/uploads"
  OTEL_SERVICE_NAME: "afribiz-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: afribiz
data:
  NEXT_PUBLIC_API_URL: "https://api.afribiz.com"
  NEXT_PUBLIC_APP_NAME: "AfriBiz"
  NEXT_PUBLIC_APP_VERSION: "1.0.0"
