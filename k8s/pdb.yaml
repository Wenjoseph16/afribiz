apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: afribiz
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: afribiz
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: frontend
